name: Cloudflare Pages live smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify Cloudflare deployment has the new UI
        env:
          SITE: https://random-wheel-58c.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "Live check attempt $attempt"
            if curl --fail --location --silent --show-error --max-time 18 "$SITE/?sha=$GITHUB_SHA" -o /tmp/rw-home.html \
              && grep -Fq 'Settle anything.' /tmp/rw-home.html \
              && grep -Fq 'data-action="center"' /tmp/rw-home.html \
              && grep -Fq 'data-palette="sunset"' /tmp/rw-home.html \
              && curl --fail --location --silent --show-error --max-time 18 "$SITE/random-number-wheel/1-100/?sha=$GITHUB_SHA" -o /tmp/rw-number.html \
              && grep -Fq 'Random Number Generator 1 to 100' /tmp/rw-number.html \
              && grep -Fq 'data-role="batch"' /tmp/rw-number.html \
              && grep -Fq 'data-action="export-csv"' /tmp/rw-number.html \
              && curl --fail --location --silent --show-error --max-time 18 "$SITE/random-number-wheel/?sha=$GITHUB_SHA" -o /tmp/rw-general-number.html \
              && grep -Fq 'Other exact number ranges' /tmp/rw-general-number.html \
              && grep -Fq 'Pick 1–9' /tmp/rw-general-number.html \
              && grep -Fq 'Pick 1–14' /tmp/rw-general-number.html \
              && grep -Fq 'data-action="shuffle"' /tmp/rw-home.html \
              && curl --fail --location --silent --show-error --max-time 18 "$SITE/random-letter-wheel/?sha=$GITHUB_SHA" -o /tmp/rw-letters.html \
              && grep -Fq 'Random Letter Wheel' /tmp/rw-letters.html \
              && grep -Fq 'data-role="letter-set"' /tmp/rw-letters.html \
              && grep -Fq 'data-role="letter-exclude"' /tmp/rw-letters.html \
              && grep -Eq 'name="robots" content="noindex, (follow|nofollow)"' /tmp/rw-letters.html \
              && curl --fail --location --silent --show-error --max-time 18 "$SITE/yes-or-no-wheel/?sha=$GITHUB_SHA" -o /tmp/rw-yesno.html \
              && grep -Fq 'Yes or No Wheel' /tmp/rw-yesno.html \
              && grep -Fq 'data-role="decision-mode"' /tmp/rw-yesno.html \
              && grep -Eq 'name="robots" content="noindex, (follow|nofollow)"' /tmp/rw-yesno.html \
              && curl --fail --location --silent --show-error --max-time 18 "$SITE/random-word-wheel/?sha=$GITHUB_SHA" -o /tmp/rw-words.html \
              && grep -Fq 'Random Word Wheel' /tmp/rw-words.html \
              && grep -Fq 'data-role="word-category"' /tmp/rw-words.html \
              && grep -Fq 'data-role="word-custom"' /tmp/rw-words.html \
              && grep -Eq 'name="robots" content="noindex, (follow|nofollow)"' /tmp/rw-words.html \
              && curl --fail --location --silent --show-error --max-time 18 "$SITE/random-number-wheel/1-8/?sha=$GITHUB_SHA" -o /tmp/rw-station8.html \
              && grep -Fq 'id="station-assignment"' /tmp/rw-station8.html \
              && grep -Fq 'data-task="copy"' /tmp/rw-station8.html \
              && curl --fail --location --silent --show-error --max-time 18 "$SITE/random-number-wheel/1-30/?sha=$GITHUB_SHA" -o /tmp/rw-attendance30.html \
              && grep -Fq 'id="classroom-roll-call"' /tmp/rw-attendance30.html \
              && grep -Fq 'data-absent-number="30"' /tmp/rw-attendance30.html \
              && grep -Fq 'data-task="undo"' /tmp/rw-attendance30.html \
              && grep -Fq 'data-task="export-called"' /tmp/rw-attendance30.html \
              && grep -Eq 'name="robots" content="noindex, (follow|nofollow)"' /tmp/rw-attendance30.html; then
                all_ok=1
                for preset in '1-2:2' '1-8:8' '1-10:10' '1-50:50' '1-7:7' '1-15:15' '1-30:30' '1-200:200' '1-1000:1000' '1-10000:10000'; do
                  slug="${preset%%:*}"
                  maximum="${preset##*:}"
                  page="/tmp/rw-${slug}.html"
                  if ! curl --fail --location --silent --show-error --max-time 18 "$SITE/random-number-wheel/$slug/?sha=$GITHUB_SHA" -o "$page" \
                       || ! grep -Fq "value=\"$maximum\"" "$page" \
                       || ! grep -Eq 'name="robots" content="noindex, (follow|nofollow)"' "$page"; then
                    echo "Candidate page missing, wrong default range, or unintentionally indexable: $slug"
                    all_ok=0
                    break
                  fi
                done
                if [ "$all_ok" -ne 1 ]; then sleep 12; continue; fi
                echo "LIVE VERIFIED: 10 number candidate pages + word/letter/yes-no pages hard-noindex and all configured controls present"
                echo "Homepage response bytes: $(wc -c < /tmp/rw-home.html)"
                echo "Number page response bytes: $(wc -c < /tmp/rw-number.html)"
                exit 0
            fi
            sleep 12
          done
          echo "Live URL not updated/accessible with expected UI during checks" >&2
          exit 1
