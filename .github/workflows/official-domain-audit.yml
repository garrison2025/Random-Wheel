name: Official domain audit
on:
  workflow_dispatch:
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify official domain, redirects and SEO whitelist
        run: npm run audit:live
