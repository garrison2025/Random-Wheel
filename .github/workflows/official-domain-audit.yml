name: Official domain audit
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify official domain, redirects and SEO whitelist
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:live 2>&1 | tee official-domain-audit.log
      - name: Archive pass/fail details for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-domain-audit-report
          path: official-domain-audit.log
          if-no-files-found: warn
