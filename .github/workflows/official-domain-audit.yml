name: Official domain audit
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: official-domain-audit
  cancel-in-progress: true
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the exact commit on numberspinner.com
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            echo "Checking official deployment SHA, attempt $attempt"
            if curl --fail --silent --show-error --max-time 16 "https://numberspinner.com/?audit=$GITHUB_SHA" -o /tmp/number-spinner-live.html \
              && grep -Fq "name=\"number-spinner-deployment\" content=\"$GITHUB_SHA\"" /tmp/number-spinner-live.html; then
              echo "Official production build matches commit $GITHUB_SHA"
              exit 0
            fi
            sleep 12
          done
          echo "Official domain is not yet serving the expected deployment SHA" >&2
          exit 1
      - name: Verify official domain, redirects and SEO whitelist
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:live 2>&1 | tee official-domain-audit.log
      - name: Archive pass/fail details for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-domain-audit-report
          path: official-domain-audit.log
          if-no-files-found: warn
