
name: Quality checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type and Astro checks
        run: npm run check
      - name: Algorithm tests
        run: npm test
      - name: Static build
        run: npm run build
      - name: Audit route output
        run: node scripts/audit-pages.mjs
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload visual review screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: test-results/
          if-no-files-found: ignore
      - name: Archive Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
