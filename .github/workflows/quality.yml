
name: Quality checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type and Astro checks
        run: npm run check
      - name: Algorithm tests
        run: npm test
      - name: Static build
        run: npm run build
      - name: Audit route output
        run: node scripts/audit-pages.mjs
      - name: Enforce candidate SEO release gates
        run: node scripts/audit-candidate-gates.mjs
      - name: Build official-domain SEO variant
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://numberspinner.com
          PUBLIC_INDEXABLE: 'true'
      - name: Verify official-domain canonical and 13-route sitemap
        run: npm run seo:audit
        env:
          PUBLIC_SITE_URL: https://numberspinner.com
          PUBLIC_INDEXABLE: 'true'
      - name: Verify held candidate noindex in official-domain build
        run: node scripts/audit-candidate-gates.mjs
        env:
          PUBLIC_SITE_URL: https://numberspinner.com
          PUBLIC_INDEXABLE: 'true'
      - name: Build with Cloudflare main production defaults
        run: npm run build
        env:
          CF_PAGES: '1'
          CF_PAGES_BRANCH: main
      - name: Audit automatic production canonical and sitemap
        run: npm run seo:audit
        env:
          CF_PAGES: '1'
          CF_PAGES_BRANCH: main
      - name: Audit held routes in automatic production build
        run: node scripts/audit-candidate-gates.mjs
        env:
          CF_PAGES: '1'
          CF_PAGES_BRANCH: main
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload visual review screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: test-results/
          if-no-files-found: ignore
      - name: Archive Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
